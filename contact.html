<title>Contact - islandprodata</title>
<style>
body{margin:0;background:#f5f8f6;color:#111827;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:32px 20px 60px}
h1{font-size:clamp(24px,4vw,34px);letter-spacing:-.02em;margin:0 0 6px;color:#0d3d21}
h2{font-size:19px;margin:28px 0 8px;color:#14632f}
p{margin:0 0 14px}
a{color:#166534}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=email],textarea{width:100%;max-width:560px;padding:10px 12px;border:1px solid #cfd9d2;border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{outline:2px solid #bcd6c4;border-color:#166534}
button{margin-top:14px;padding:11px 20px;background:#166534;color:#fff;border:0;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
button:hover{background:#12522a}
.footer-note{margin-top:22px;font-size:13.5px;color:#5f6b63}
footer{border-top:1px solid #e3e8e4;margin-top:30px;padding-top:18px;color:#5f6b63;font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">
<h1>Contact</h1>

<p>Use the form below or email us directly. We typically respond within 1–2 business days.</p>

<form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
  <label for="name">Name</label>
  <input type="text" id="name" name="name" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>

  <label for="subject">Subject</label>
  <input type="text" id="subject" name="subject" required>

  <label for="message">Message</label>
  <textarea id="message" name="message" required></textarea>

  <button type="submit">Send message</button>
</form>

<p class="footer-note">Or email us directly at <a href="mailto:hello@islandprodata.example">hello@islandprodata.example</a>.</p>

<footer>

</footer>
</div>
